name: esstudy
description: "A new Flutter project."

publish_to: 'none'

version: 1.3.7+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Network & HTTP
  http: ^1.6.0
  dio: ^5.9.2
  cached_network_image: ^3.3.1

  # UI & Utilities
  flutter_colorpicker: ^1.1.0
  cupertino_icons: ^1.0.8
  uuid: ^4.5.3

  # Firebase (giữ đồng bộ)
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  firebase_storage: ^13.3.0
  cloud_firestore: ^6.3.0

  # AI
  google_generative_ai: ^0.4.7

  # Media & Files
  image_picker: ^1.2.2
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  gal: ^2.3.2
  flutter_cache_manager: ^3.4.0

  # Notifications & Permissions
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  permission_handler: ^11.3.1

  # Utility
  shared_preferences: ^2.3.5
  universal_html: ^2.3.0
  flutter_webrtc: ^1.4.1
  flutter_launcher_icons: ^0.14.3
  flutter_markdown: ^0.7.7+1
  flutter_markdown_latex: ^0.3.4
  markdown: ^7.3.1
  file_picker: ^11.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0   # Hoặc ^6.0.0 nếu bạn muốn

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/capybara.gif